<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Social Links Profile</title>
  <link rel="stylesheet" href="style.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
</head>
<body>

  <!-- Main container: profile card -->
  <main class="profile-card">
    <!-- Profile Photo -->
    <img src="assets/images/my_photo.webp" alt="Alain Bahane" class="profile-photo">

    <!-- Name and Location -->
    <h1 class="name">Alain Bahane</h1>
    <h2 class="location">Bukavu, DRC</h2>
    <p class="bio">Front-end developer and on-going learner.</p>

    <!-- Social Links (Text-only frames) -->
    <div class="social-links">
      <a href="https://github.com/alainbahanep" target="_blank" class="social-item">GitHub</a>
      <a href="https://www.frontendmentor.io/profile/alainbahanep" target="_blank" class="social-item">Frontend Mentor</a>
      <a href="https://www.linkedin.com/in/alain-bahane-300834254?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" class="social-item">LinkedIn</a>
      <a href="https://x.com/alainbaha" target="_blank" class="social-item">X/Twitter</a>
      <a href="https://www.instagram.com/alainpierre3" target="_blank" class="social-item">Instagram</a>
    </div>
  </main>

  <!-- Footer: Attribution -->
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/alainbahanep" target="_blank">Alain Bahane</a>.
  </footer>

</body>
</html>
